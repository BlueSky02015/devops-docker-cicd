name: Build and Push Docker Image

# Trigger: jalankan saat push ke branch main
on:
  push:
    branches:
      - main
  workflow_dispatch:  # Bisa juga dijalankan manual

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code dari repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Setup Docker Buildx (untuk build image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 3: Login ke Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # Step 4: Extract metadata (tags, labels)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/devops-docker-cicd
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      # Step 5: Build dan Push Docker image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      # Step 6: Tampilkan image yang berhasil di-push
      - name: Image digest
        run: echo "Image pushed: ${{ steps.meta.outputs.tags }}"
